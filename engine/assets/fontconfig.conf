<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 저장소 글꼴(engine/assets/fonts)을 Craft 앱에 보이게 한다. 시스템 글꼴은 그대로 쓴다 -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="xdg">fluma-fontconfig</cachedir>
</fontconfig>
