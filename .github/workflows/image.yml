# 미리 빌드한 Docker 이미지 — 사용자가 15분 빌드 대신 `docker compose pull` 로 받는다(ghcr.io/meowassassin/fluma).
# 이미지가 약 15GB 라 커밋마다 올리지 않는다: 버전 태그(v*) · 손으로 실행 · 매주 월요일.
name: image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (image is ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: t
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          TAGS="$IMG:latest,$IMG:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAGS="$TAGS,$IMG:${GITHUB_REF#refs/tags/}"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.t.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Fluma — local Shorts studio (everything included)
            org.opencontainers.image.licenses=Apache-2.0
