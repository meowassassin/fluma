# GPU 연결(Linux · Intel/AMD) — 그래픽 장치를 쓰는 렌더 · 효과가 빨라진다. 없으면 CPU 로 돈다.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# FLUMA_RENDER_GID = 내 컴퓨터의 render 그룹 번호: getent group render
services:
  fluma:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${FLUMA_RENDER_GID:-105}"
