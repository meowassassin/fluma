# 미리 빌드한 Docker 이미지 — 사용자가 15분 빌드 대신 `docker compose pull` 로 받는다(ghcr.io/meowassassin/fluma).
# 이미지가 약 15GB 라 커밋마다 올리지 않는다: 버전 태그(v*) · 손으로 실행 · 매주 월요일.
# amd64(Intel · AMD) · arm64(Apple Silicon · ARM 서버) 둘 다 — 각 CPU 의 러너에서 따로 빌드(에뮬레이션 없이) → 한 이름으로 묶는다.
name: image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Free disk space (image is ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: b
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMG }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Fluma — local Shorts studio (everything included)
            org.opencontainers.image.licenses=Apache-2.0
      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.b.outputs.digest }}"; touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One name for both CPUs
        working-directory: /tmp/digests
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          TAGS="-t $IMG:latest -t $IMG:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAGS="$TAGS -t $IMG:${GITHUB_REF#refs/tags/}"; fi
          docker buildx imagetools create $TAGS $(printf "$IMG@sha256:%s " *)
          docker buildx imagetools inspect $IMG:latest
